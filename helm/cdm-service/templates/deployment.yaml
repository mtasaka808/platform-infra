apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdm-service.fullname" . }}
  labels:
    {{- include "cdm-service.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cdm-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cdm-service.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cdm-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            {{- include "cdm-service.selectorLabels" . | nindent 12 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.service.containerPort }}
          protocol: TCP
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if or .Values.env .Values.externalSecrets.enabled }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.externalSecrets.enabled }}
        {{- range .Values.externalSecrets.secrets }}
        - name: {{ .name }}
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}-secrets
              key: {{ .name }}
        {{- end }}
        {{- end }}
        {{- end }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        {{- if .Values.nginx.enabled }}
        {{- range .Values.nginx.writablePaths }}
        - name: nginx-writable-{{ . | replace "/" "-" | trimPrefix "-" }}
          mountPath: {{ . }}
        {{- end }}
        {{- end }}
        {{- if .Values.mfManifest.enabled }}
        - name: mf-manifest
          mountPath: /usr/share/nginx/html/module-federation.manifest.json
          subPath: module-federation.manifest.json
          readOnly: true
        {{- end }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "cdm-service.fullname" . }}-data
      {{- end }}
      {{- if .Values.nginx.enabled }}
      {{- range .Values.nginx.writablePaths }}
      - name: nginx-writable-{{ . | replace "/" "-" | trimPrefix "-" }}
        emptyDir: {}
      {{- end }}
      {{- end }}
      {{- if .Values.mfManifest.enabled }}
      - name: mf-manifest
        configMap:
          name: {{ .Values.mfManifest.configMapName }}
      {{- end }}

# ClusterSecretStore — tells External Secrets Operator to use AWS Secrets Manager.
# Deploy once per cluster. The serviceAccount must have the IRSA role from the
# eks Terraform module (external_secrets_role_arn output).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: REGION  # replace with your AWS region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

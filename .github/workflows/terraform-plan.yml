name: Terraform Plan

on:
  pull_request:
    paths:
    - 'terraform/**'

jobs:
  changed-environments:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - id: detect
      run: |
        envs=$(git diff --name-only origin/main...HEAD \
          | grep '^terraform/environments/' \
          | awk -F/ '{print $3}' \
          | sort -u \
          | jq -Rcn '[inputs]')
        echo "matrix={\"environment\":${envs}}" >> $GITHUB_OUTPUT

  plan:
    name: Plan ${{ matrix.environment }}
    needs: changed-environments
    if: needs.changed-environments.outputs.matrix != '{"environment":[]}'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.changed-environments.outputs.matrix) }}
      fail-fast: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~1.9"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets[format('AWS_TF_ROLE_ARN_{0}', upper(matrix.environment))] }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Terraform Init
      working-directory: terraform/environments/${{ matrix.environment }}
      run: terraform init -backend-config=backend.tfvars -input=false

    - name: Terraform Plan
      id: plan
      working-directory: terraform/environments/${{ matrix.environment }}
      run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

    - name: Post plan to PR
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan.txt', 'utf8');
          const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Terraform Plan — \`${{ matrix.environment }}\`\n\`\`\`\n${truncated}\n\`\`\``
          });

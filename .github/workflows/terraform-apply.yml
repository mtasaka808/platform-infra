name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
    - 'terraform/**'

jobs:
  changed-environments:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
      with: { fetch-depth: 2 }
    - id: detect
      run: |
        envs=$(git diff --name-only HEAD~1 HEAD \
          | grep '^terraform/environments/' \
          | awk -F/ '{print $3}' \
          | sort -u \
          | jq -Rcn '[inputs]')
        echo "matrix={\"environment\":${envs}}" >> $GITHUB_OUTPUT

  apply:
    name: Apply ${{ matrix.environment }}
    needs: changed-environments
    if: needs.changed-environments.outputs.matrix != '{"environment":[]}'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.changed-environments.outputs.matrix) }}
      fail-fast: false
    environment: ${{ matrix.environment }}   # GitHub Environment approval gate
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~1.9"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets[format('AWS_TF_ROLE_ARN_{0}', upper(matrix.environment))] }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Terraform Init
      working-directory: terraform/environments/${{ matrix.environment }}
      run: terraform init -backend-config=backend.tfvars -input=false

    - name: Terraform Apply
      working-directory: terraform/environments/${{ matrix.environment }}
      run: terraform apply -auto-approve -input=false
